<!DOCTYPE html>

<html>

<head>

<title>Patients</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Patient Records</h2>

<a href="/add/" class="btn btn-success mb-3">

Add Patient

</a>

<table class="table table-bordered">

<tr>

<th>Name</th>

<th>Email</th>

<th>Glucose</th>

<th>Hb</th>

<th>Cholesterol</th>

<th>Remarks</th>

<th>Actions</th>

</tr>

{% for p in patients %}

<tr>

<td>{{ p.full_name }}</td>

<td>{{ p.email }}</td>

<td>{{ p.glucose }}</td>

<td>{{ p.haemoglobin }}</td>

<td>{{ p.cholesterol }}</td>

<td>{{ p.remarks }}</td>

<td>

<a class="btn btn-warning"

href="/update/{{p.id}}">

Edit

</a>

<a class="btn btn-danger"

href="/delete/{{p.id}}">

Delete

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
